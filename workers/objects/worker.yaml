# objects worker — dedicated DO container
# Hosts all Durable Objects so other workers can use preview URLs
name: hi-objects
secrets:
  - DATABASE_URL
  - CLERK_SECRET_KEY

analytics_engine_datasets:
  - binding: STREAM_AE
    dataset: hyperintel_stream_metrics

services:
  - binding: CHAT_SERVICES
    service: hi-services
    entrypoint: ChatServices

durable_objects:
  - name: USER_GATEWAY
    class_name: UserGateway
    local: true
  - name: CHAT_STREAM_DO
    class_name: ChatStreamDO
    local: true
  - name: GENERATION_PROXY
    class_name: GenerationProxyDO
    local: true
  - name: LOCKS_SERVICE
    class_name: LocksService
    local: true
  - name: CHAT_STREAM_STATE_DO
    class_name: ChatStreamStateDO
    script_name: hi-stream-state

migrations:
  - tag: v1_initial
    new_sqlite_classes:
      - UserGateway
      - ChatStreamDO
  - tag: v2_generation_proxy
    new_sqlite_classes:
      - GenerationProxyDO
  - tag: v3_locks_service
    new_sqlite_classes:
      - LocksService
