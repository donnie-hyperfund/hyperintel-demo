# Master configuration for all workers
# Generator reads this + per-worker worker.yaml to produce wrangler.jsonc, package.json, tsconfig.json

store_id: b0b79b79a9e4400384c1e86239b96635

# Environments with suffixes for service/queue/DO names
envs:
  production:
    suffix: ""
  dev:
    suffix: "-dev"
  exp:
    suffix: "-exp"
    inherits: dev
  dexp:
    suffix: "-dexp"
    inherits: dev

# All available secrets with per-env secret_name mappings
# Simple string = same name all envs
# Object = per-env mapping
secrets:
  DATABASE_URL:
    production: HI_DATABASE_URL # TODO ...
    dev: DEV_HI_DATABASE_URL
    exp: HI_DATABASE_URL          # exp shares prod DB
    dexp: DEV_HI_DATABASE_URL     # dexp shares dev DB
  CLERK_SECRET_KEY:
    production: CLERK_SECRET_KEY
    dev: DEV_CLERK_SECRET_KEY
  ANTHROPIC_API_KEY:
    production: HI_ANTHROPIC_API_KEY_PROD
    dev: HI_ANTHROPIC_API_KEY_DEV
  OPENAI_KEY: OPENAI_KEY
  OPENROUTER_API_KEY: DEV_OPENROUTER_API_KEY  # TODO: using dev key for now
  LANGFUSE_SECRET_KEY: HI_LANGFUSE_SECRET_KEY
  POSTHOG_KEY: POSTHOG_KEY
  CF_TOKEN: CF_TOKEN
  AUTH_SECRET: QUEUE_AUTH_SECRET
  VERCEL_BYPASS_SECRET: VERCEL_BYPASS_SECRET
  FIRECRAWL_API_KEY: FIRECRAWL_API_KEY
  R2_ACCESS_KEY_ID: R2_ACCESS_KEY_ID
  R2_SECRET_ACCESS_KEY: R2_SECRET_ACCESS_KEY
  CF_ACCOUNT_ID: CF_ACCOUNT_ID
  REDUCTO_API_KEY: REDUCTO_API_KEY

# Default secrets included in EVERY worker
default_secrets: []

# All available vars with per-env values
# Simple string = same value all envs
# Object = per-env value (missing env = not included for that env)
vars:
  CORS_ALLOWED_ORIGIN:
    production: "https://app.hprntl.ai"
    dev: "https://dev-app.hprntl.ai"
  CLERK_PUBLISHABLE_KEY:
    production: "pk_live_Y2xlcmsuaHBybnRsLmFpJA"
    dev: "pk_test_Y3Jpc3AtZXNjYXJnb3QtNzMuY2xlcmsuYWNjb3VudHMuZGV2JA"
  LANGFUSE_HOST: "https://us.cloud.langfuse.com"
  LANGFUSE_PUBLIC_KEY: "pk-lf-56f0afd5-8b8e-446e-8a0b-bd2b4c80a780"
  LANGFUSE_ENVIRONMENT:
    production: "production"
    dev: "development"
  CHAT_OUTPUT_SAFETY_ENABLED: "false"
  POSTHOG_HOST: "https://us.i.posthog.com"
  ENV:
    dev: "dev"  # prod is unset - code defaults to 'prod'
  APP_BASE:
    production: "https://app.hprntl.ai/"
    dev: "https://dev-app.hprntl.ai/"


# Default KV namespaces included in EVERY worker
default_kv_namespaces:
  - binding: PREVIEW_DB_MAP
    id:
      dev: "1e9db27be0384a5b8da2244b4051b784"

# Default vars included in EVERY worker
default_vars:
  - CLERK_PUBLISHABLE_KEY
  - ENV
  - LANGFUSE_HOST
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_ENVIRONMENT
  - CORS_ALLOWED_ORIGIN

# Template files to copy to each worker if they don't exist
# Filename only = from _common/config/templates/
# Starts with ./ = relative to this config file
templates:
  - .gitignore

# Shared tsconfig settings
tsconfig:
  target: "es2021"
  lib: ["es2021"]
  jsx: "react-jsx"
  module: "es2022"
  moduleResolution: "Bundler"
  types: ["@cloudflare/workers-types/2023-07-01"]
  resolveJsonModule: true
  allowJs: true
  checkJs: false
  noEmit: true
  isolatedModules: true
  allowSyntheticDefaultImports: true
  forceConsistentCasingInFileNames: true
  strict: true
  skipLibCheck: true
  paths:
    "@/*": ["../../*"]
    "@common/*": ["../../common/*"]
    "@worker/*": ["../_common/*"]

# Shared package.json scripts
package_scripts:
  deploy: "wrangler deploy"
  dev: "wrangler dev"
  start: "wrangler dev"
  test: "vitest"
  typegen: "tsx ../_common/config/typegen.ts"

# Wrangler defaults
wrangler_defaults:
  compatibility_flags: ["nodejs_compat"]
  compatibility_date: "2025-04-29"
  workers_dev: true
  preview_urls: true
  observability:
    enabled: true

# Module aliases for esbuild bundler (stubs for unused packages)
# These are applied at bundle-time, not TypeScript check time
# Paths are relative to each worker folder (e.g., workers/chat/)
aliases:
  "@supabase/supabase-js": "../_common/vendor/stubs/supabase-js.ts"
  "stripe": "../_common/vendor/stubs/stripe.ts"
  "@sendgrid/mail": "../_common/vendor/stubs/sendgrid-mail.ts"
  "@cerebras/cerebras_cloud_sdk": "../_common/vendor/stubs/cerebras.ts"
  "mariadb/callback": "../_common/vendor/stubs/empty.ts"
  "better-sqlite3": "../_common/vendor/stubs/empty.ts"
  "libsql": "../_common/vendor/stubs/empty.ts"
  "reductoai": "../_common/vendor/stubs/reductoai.ts"
