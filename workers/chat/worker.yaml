# chat worker definition
name: hi-chat
secrets:
  - DATABASE_URL
  - CLERK_SECRET_KEY
  - ANTHROPIC_API_KEY
  - OPENROUTER_API_KEY
  - OPENAI_KEY
  - LANGFUSE_SECRET_KEY
  - POSTHOG_KEY
  - AUTH_SECRET
  - FIRECRAWL_API_KEY
  - R2_ACCESS_KEY_ID
  - R2_SECRET_ACCESS_KEY
  - CF_ACCOUNT_ID

r2_buckets:
  - binding: ARTIFACTS_BUCKET
    bucket_name:
      production: hi-artifacts
      dev: hi-artifacts-dev
  - binding: USER_IMAGES_BUCKET
    bucket_name:
      production: hi-user-images
      dev: hi-user-images-dev

queues:
  producers:
    - binding: EMBEDDING_QUEUE
      queue: hi-embedding-queue
    - binding: EXTRACTION_QUEUE
      queue: hi-extraction-queue

vars:
  - CHAT_OUTPUT_SAFETY_ENABLED
  - POSTHOG_HOST: "https://us.i.posthog.com"
  - ALLOWED_PRESETS:
      production: "sonnet"
  - DEFAULT_PRESET:
      production: "sonnet"

# ai: true
# browser: true

# services:
#   - binding: SOME_SERVICE
#     entrypoint: SomeEntrypoint

durable_objects:
  - name: USER_GATEWAY
    class_name: UserGateway
    script_name: hi-objects
  - name: CHAT_STREAM_DO
    class_name: ChatStreamDO
    script_name: hi-objects
  - name: GENERATION_PROXY
    class_name: GenerationProxyDO
    script_name: hi-objects

triggers:
  crons: ["0 * * * *"]
