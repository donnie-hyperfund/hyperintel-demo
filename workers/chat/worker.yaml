# chat worker definition
name: hi-chat
secrets:
  - DATABASE_URL
  - CLERK_SECRET_KEY
  - ANTHROPIC_API_KEY
  - OPENROUTER_API_KEY
  - OPENAI_KEY
  - LANGFUSE_SECRET_KEY
  - AUTH_SECRET
  - FIRECRAWL_API_KEY
  - R2_ACCESS_KEY_ID
  - R2_SECRET_ACCESS_KEY
  - CF_ACCOUNT_ID

r2_buckets:
  - binding: ARTIFACTS_BUCKET
    bucket_name:
      production: hi-artifacts
      dev: hi-artifacts-dev

queues:
  producers:
    - binding: EMBEDDING_QUEUE
      queue: hi-embedding-queue
    - binding: EXTRACTION_QUEUE
      queue: hi-extraction-queue

# vars:
#   - SOME_VAR

# ai: true
# browser: true

# services:
#   - binding: SOME_SERVICE
#     entrypoint: SomeEntrypoint

# durable_objects:
#   - name: SOME_DO
#     class_name: SomeClass
#     script_name: services  # external, or local: true

triggers:
  crons: ["*/15 * * * *"]
