# chat worker definition
name: hi-chat
secrets:
  - DATABASE_URL
  - CLERK_SECRET_KEY
  - ANTHROPIC_API_KEY
  - OPENROUTER_API_KEY
  - OPENAI_KEY
  - LANGFUSE_SECRET_KEY
  - AUTH_SECRET

# Queue producer for embedding jobs
queues:
  producers:
    - binding: EMBEDDING_QUEUE
      queue: hi-embedding-queue

