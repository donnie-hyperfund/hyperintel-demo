# embedding worker definition
name: hi-embedding
secrets:
  - DATABASE_URL
  - OPENAI_KEY
  - OPENROUTER_API_KEY
  - LANGFUSE_SECRET_KEY
  - AUTH_SECRET

# AI clients needed for embeddings
# ai: true

unstub:
