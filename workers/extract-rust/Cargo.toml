[package]
name = "hi-extract-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.7", features = ["http"] }
worker-macros = { version = "0.7", features = ["http"] }
http = "1.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image extraction from DOCX/PPTX zip archives
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }

# Text-in-image detection heuristic
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
imageproc = { version = "0.24", default-features = false }

# Vendored extraction crates
markdownify = { path = "vendor/markdownify" }
unpdf = { path = "vendor/unpdf", default-features = false, features = ["fast-parse"] }
docx-parser = { path = "vendor/docx-parser" }
pptx-to-md = { path = "vendor/pptx-to-md", default-features = false }
base64 = "0.22"
