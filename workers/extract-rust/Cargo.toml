[package]
name = "hi-extract-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.7", features = ["http"] }
worker-macros = { version = "0.7", features = ["http"] }
http = "1.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

extract-core = { path = "core" }
