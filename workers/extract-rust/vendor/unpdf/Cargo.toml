[package]
name = "unpdf"
version = "0.2.4"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "High-performance PDF content extraction to Markdown, text, and JSON"
repository = "https://github.com/iyulab/unpdf"
homepage = "https://github.com/iyulab/unpdf"
documentation = "https://docs.rs/unpdf"
readme = "README.md"
keywords = ["pdf", "markdown", "text-extraction", "document", "parser"]
categories = ["parser-implementations", "text-processing"]
rust-version = "1.75"

[lib]
name = "unpdf"
crate-type = ["lib"]

[features]
default = ["fast-parse"]
ffi = []
async = ["tokio"]
fast-parse = []

[dependencies]
# PDF parsing
lopdf = { version = "0.39", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Text processing
regex = "1.11"
unicode-normalization = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"

# WASM-compatible randomness (needed by lopdf's encryption transitive deps)
getrandom = { version = "0.3", features = ["wasm_js"] }

# Optional: Async I/O
tokio = { version = "1.42", features = ["rt", "fs"], optional = true }
