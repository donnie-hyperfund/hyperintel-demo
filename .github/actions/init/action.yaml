name: Setup repo
inputs:
  node-version:
    default: '22'
  clone-token:
    required: true
    description: PAT for private submodule checkout
  skip-cache:
    default: 'false'
runs:
  using: composite
  steps:
    - run: |
        git config --global url."https://x-access-token:${{ inputs.clone-token }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive
      shell: bash
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
    - id: pnpm-store
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.skip-cache != 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ hashFiles('pnpm-lock.yaml', 'common/pnpm-lock.yaml') }}
        restore-keys: pnpm-
    - run: pnpm install --frozen-lockfile
      shell: bash
