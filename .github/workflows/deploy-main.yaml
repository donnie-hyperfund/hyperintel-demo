name: Deploy Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/init
        with:
          clone-token: ${{ secrets.CLONE_TOKEN }}

      - name: Compile ORM
        run: pnpm run db:compile
        env:
          DATABASE_URL: ${{ secrets.NEON_MAIN_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.NEON_MAIN_DATABASE_URL_DIRECT }}

      - name: Run migrations
        run: pnpm run db:migration:up
        env:
          DATABASE_URL: ${{ secrets.NEON_MAIN_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.NEON_MAIN_DATABASE_URL_DIRECT }}

      - name: Deploy dev workers
        run: |
          failed=0
          # Deploy dependencies first so downstream workers can resolve external DO/service bindings.
          for name in objects extract-rust chat embedding extraction services; do
            dir="workers/$name/"
            [[ ! -d "$dir" ]] && continue
            [[ "$name" == _common || "$name" == node_modules ]] && continue
            config=""
            if [[ -f "$dir/wrangler.jsonc" ]]; then
              config="$dir/wrangler.jsonc"
            elif [[ -f "$dir/wrangler.toml" ]]; then
              config="$dir/wrangler.toml"
            else
              continue
            fi
            config_name=$(basename "$config")
            echo "::group::Deploying $name"
            if ! (
              cd "$dir"
              npx wrangler deploy --env=dev --config "$config_name"
            ); then
              echo "::error::Failed to deploy $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
