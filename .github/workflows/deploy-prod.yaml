name: Deploy Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Verify branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/prod" ]]; then
            echo "::error::Must be run from the prod branch"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: ./.github/actions/init
        with:
          clone-token: ${{ secrets.CLONE_TOKEN }}

      - name: Compile ORM
        run: pnpm run db:compile
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.NEON_PROD_DATABASE_URL_DIRECT }}

      - name: Run migrations
        run: pnpm run db:migration:up
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.NEON_PROD_DATABASE_URL_DIRECT }}

      - name: Deploy prod workers
        run: |
          failed=0
          for dir in workers/*/; do
            name=$(basename "$dir")
            [[ "$name" == _common || "$name" == node_modules || "$name" == objects ]] && continue
            [[ ! -f "$dir/wrangler.jsonc" ]] && continue
            echo "::group::Deploying $name"
            if ! npx wrangler deploy --config "$dir/wrangler.jsonc"; then
              echo "::error::Failed to deploy $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
