name: PR Check
on:
    pull_request:
        types: [opened, synchronize]
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0

            - name: Init repo and submodules
              uses: ./.github/actions/init
              with:
                  clone-token: ${{ secrets.CLONE_TOKEN }}

            - name: Generate type artifacts
              env:
                  NO_POSTHOG: 'true'
                  DATABASE_URL: 'postgresql://user@127.0.0.1/hidb?sslmode=disable'
                  DATABASE_URL_DIRECT: 'postgresql://user@127.0.0.1/hidb?sslmode=disable'
              run: |
                  pnpm exec next typegen
                  pnpm run db:compile-metadata

            - name: Typecheck
              run: pnpm run tsc:check:ci

            - name: Get changed files
              id: changed
              run: |
                  {
                      echo "files<<EOF"
                      git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' ':!common/' ':!workers/_common/'
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Biome lint fix changed files
              if: steps.changed.outputs.files != ''
              run: |
                  mapfile -t files <<'EOF'
                  ${{ steps.changed.outputs.files }}
                  EOF
                  pnpm exec biome check --write --formatter-enabled=false --assist-enabled=false --reporter=github "${files[@]}"

            - name: Biome format changed PR lines
              run: pnpm run fix:old-formatting:hunks -- --only-changed-lines=origin/${{ github.base_ref }}

            - name: Commit fixes
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: 'style: autofix (biome)'
                  commit_options: '--no-verify'
