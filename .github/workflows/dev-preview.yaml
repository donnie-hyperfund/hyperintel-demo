name: Dev Preview

on:
  push:
    branches-ignore:
      - main
      - prod
    # Skip worker preview deployment for pushes that only change FE / docs /
    # local-tooling files. Workers consume code from `lib/`, `modules/`, and
    # `common/` (and `migrations/` runs as part of this workflow), so those
    # paths are intentionally NOT ignored. When the workflow is skipped, the
    # Vercel FE preview falls back to the canonical `*-dev` workers backed by
    # the base dev DB — see `getConnectionString` in
    # `workers/_common/vendor/postgres.ts`. Trade-off: FE-only previews lose
    # per-branch DB isolation in exchange for ~30-60s saved per push and not
    # touching workers we didn't change.
    paths-ignore:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'public/**'
      - 'docs/**'
      - 'exports/**'
      - '.husky/**'
      - '.vscode/**'
      - '.cursor/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/init
        with:
          clone-token: ${{ secrets.CLONE_TOKEN }}

      - name: Branch names
        id: branch
        run: |
          RAW="${GITHUB_REF_NAME}"
          # Cloudflare requires `alias + "-" + script_name <= 63 chars`.
          # The longest dev script we deploy is `hi-extraction-dev` (17 chars),
          # so the alias itself must be <= 45 chars (45 + 1 + 17 = 63).
          # NOTE: this sanitization is the sole source of truth for the runtime
          # alias contract. The runtime side (`extractPreviewAlias` in
          # workers/_common/util/preview-alias.ts) just parses whatever ends up
          # in the `Host` header — if you change the shape produced here, the
          # parser there must agree.
          MAX_ALIAS_LEN=45
          CF_ALIAS=$(echo "$RAW" \
            | sed 's/[^a-zA-Z0-9]/-/g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
            | cut -c1-"$MAX_ALIAS_LEN" \
            | sed 's/-$//')
          if [[ -z "$CF_ALIAS" ]]; then
            echo "::error::Branch name '$RAW' produced an empty Cloudflare alias after sanitization."
            exit 1
          fi
          echo "Branch '$RAW' -> Cloudflare alias '$CF_ALIAS' (${#CF_ALIAS} chars, max ${MAX_ALIAS_LEN})"
          echo "cf_alias=$CF_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Get or create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/${{ github.ref_name }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Compile ORM
        run: pnpm run db:compile
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}

      - name: Run migrations
        run: pnpm run db:migration:up
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}

      - name: Deploy Worker previews
        run: |
          # Write the branch→db mapping to KV
          npx wrangler kv key put "${{ steps.branch.outputs.cf_alias }}" "${{ steps.neon.outputs.db_host_pooled }}" \
            --namespace-id "${{ vars.CLOUDFLARE_DB_KV_NS_ID }}" --remote

          failed=0
          for dir in workers/*/; do
            name=$(basename "$dir")
            [[ "$name" == _common || "$name" == node_modules || "$name" == objects ]] && continue
            [[ ! -f "$dir/wrangler.jsonc" ]] && continue
            echo "::group::Deploying $name"
            if ! npx wrangler versions upload --env=dev \
              --config "$dir/wrangler.jsonc" \
              --preview-alias "${{ steps.branch.outputs.cf_alias }}"; then
              echo "::error::Failed to deploy $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
