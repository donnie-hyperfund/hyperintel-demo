name: Deploy Exp / Dexp

on:
  push:
    branches:
      - exp
      - dexp
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment (exp or dexp)'
        type: choice
        required: true
        default: exp
        options:
          - exp
          - dexp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/init
        with:
          clone-token: ${{ secrets.CLONE_TOKEN }}

      - name: Resolve target env
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.target_env }}"
          else
            TARGET="${GITHUB_REF_NAME}"
          fi
          if [[ "$TARGET" != "exp" && "$TARGET" != "dexp" ]]; then
            echo "::error::Invalid target env: $TARGET"
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Deploying to env: $TARGET"

      - name: Resolve DB secrets
        id: db
        run: |
          if [[ "${{ steps.env.outputs.target }}" == "exp" ]]; then
            echo "url=${{ secrets.NEON_PROD_DATABASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "direct=${{ secrets.NEON_PROD_DATABASE_URL_DIRECT }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ secrets.NEON_DEXP_DATABASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "direct=${{ secrets.NEON_DEXP_DATABASE_URL_DIRECT }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile ORM
        run: pnpm run db:compile
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          DATABASE_URL_DIRECT: ${{ steps.db.outputs.direct }}

      - name: Run migrations
        run: pnpm run db:migration:up
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          DATABASE_URL_DIRECT: ${{ steps.db.outputs.direct }}

      - name: Deploy Workers
        run: |
          failed=0
          for dir in workers/*/; do
            name=$(basename "$dir")
            [[ "$name" == _common || "$name" == node_modules ]] && continue
            if [[ -f "$dir/wrangler.jsonc" ]]; then
              config="$dir/wrangler.jsonc"
            elif [[ -f "$dir/wrangler.toml" ]]; then
              config="$dir/wrangler.toml"
            else
              continue
            fi
            echo "::group::Deploying $name (env=${{ steps.env.outputs.target }})"
            if ! npx wrangler deploy --env="${{ steps.env.outputs.target }}" --config "$config"; then
              echo "::error::Failed to deploy $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
