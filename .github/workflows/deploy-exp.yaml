name: Deploy Exp

on:
  push:
    branches:
      - 'exp-*'
      - 'dexp-*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment (exp or dexp)'
        type: choice
        required: true
        default: exp
        options:
          - exp
          - dexp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-exp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/init
        with:
          clone-token: ${{ secrets.CLONE_TOKEN }}

      - name: Resolve target env
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.target_env }}"
          elif [[ "${GITHUB_REF_NAME}" == dexp-* ]]; then
            TARGET="dexp"
          else
            TARGET="exp"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Deploying to env: $TARGET"

      - name: Compile ORM
        run: pnpm run db:compile
        env:
          DATABASE_URL: ${{ secrets.NEON_MAIN_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.NEON_MAIN_DATABASE_URL_DIRECT }}

      - name: Run migrations
        run: pnpm run db:migration:up
        env:
          DATABASE_URL: ${{ secrets.NEON_MAIN_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.NEON_MAIN_DATABASE_URL_DIRECT }}

      - name: Deploy workers
        run: |
          failed=0
          for dir in workers/*/; do
            name=$(basename "$dir")
            [[ "$name" == _common || "$name" == node_modules ]] && continue
            if [[ -f "$dir/wrangler.jsonc" ]]; then
              config="$dir/wrangler.jsonc"
            elif [[ -f "$dir/wrangler.toml" ]]; then
              config="$dir/wrangler.toml"
            else
              continue
            fi
            echo "::group::Deploying $name (env=${{ steps.env.outputs.target }})"
            if ! npx wrangler deploy --env="${{ steps.env.outputs.target }}" --config "$config"; then
              echo "::error::Failed to deploy $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
